openapi: 3.0.0

servers:
  - description: API Marketplace api - mocking example api
    url: https://virtserver.swaggerhub.com/HMCTS-DTS/api-cp-crime-caseadmin-case-management/0.1.0

info:
  title: Civil Case Management - Group Case API
  description: >-
    API for creating, searching, viewing and splitting civil group (bulk) cases held by the
    case-management service. Case membership and individual case data remain owned by the
    Progression context; this API owns the group_case record.
  version: 0.1.0
  contact:
    email: no-reply@hmcts.com
  license:
    name: MIT
    url: 'https://opensource.org/licenses/MIT'

security:
  - bearerAuth: []
    subscriptionKey: []

paths:
  /:
    get:
      description: Root endpoint
      operationId: getRoot
      tags:
        - root
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: Hello

  /groupcases:
    post:
      operationId: createGroupCase
      tags:
        - group-cases
      summary: Create a group case
      description: >-
        Creates a new group_case entry. Used when a group case is received from an external source
        (CPCI/CSV) via prosecution-casefile, and also during a split of a group case in the
        extract cases process. Permission: system user only. Audit required: No.
        Rejects a payload whose groupId already exists (409) and a parentGroupId that does not
        exist (404).
      parameters:
        - $ref: '#/components/parameters/CjscppuidHeader'
        - $ref: '#/components/parameters/CppclientcorrelationidHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupCaseRequest'
      responses:
        '200':
          description: Group case created
        '400':
          description: Bad request (invalid payload)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access control violation (not a system user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Referenced group case not found (e.g. parentGroupId does not exist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A group case with this groupId already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groupcases/search:
    get:
      operationId: searchGroupCases
      tags:
        - group-cases
      summary: Search group cases by hearing location and date
      description: >-
        Returns a paginated summary list of group cases matching the hearing court location and date.
        Member case ids are not returned. No matches returns 200 with an empty list.
        Permission: view_group_case (Court Admin, Legal Advisor). Audit required: Yes.
      parameters:
        - $ref: '#/components/parameters/CjscppuidHeader'
        - $ref: '#/components/parameters/CppclientcorrelationidHeader'
        - in: query
          name: courtHearingLocation
          required: true
          description: Court house and room as a single OU code (7 characters, final 2 denote the courtroom)
          schema:
            type: string
        - in: query
          name: dateOfHearing
          required: true
          description: Date of the hearing
          schema:
            type: string
            format: date
        - in: query
          name: page
          required: false
          description: Zero-based page index
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: pageSize
          required: false
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of matching group cases (possibly empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCaseSearchResponse'
        '400':
          description: Mandatory query parameters missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access control violation (view_group_case required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groupcases/resultintent:
    get:
      operationId: getGroupCaseResultingIntents
      tags:
        - group-cases
      summary: Get the resulting intent for one or more group cases
      description: >-
        Returns the resulting intent for each requested group id. Used by manage hearing screens, either
        directly by HMCTS staff (view_group_case) or by the hearing query API as a system user.
        Audit required: Yes. Group ids that are not found are omitted from the response (partial
        lookup); if none are found the response is 200 with an empty list.
      parameters:
        - $ref: '#/components/parameters/CjscppuidHeader'
        - $ref: '#/components/parameters/CppclientcorrelationidHeader'
        - in: query
          name: groupIds
          required: true
          description: Comma-separated list of group case ids (at least one)
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Resulting intent per group case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCaseResultingIntentsResponse'
        '400':
          description: groupIds not provided or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access control violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groupcases/{groupId}:
    get:
      operationId: getGroupCase
      tags:
        - group-cases
      summary: View a group case
      description: >-
        Returns the group case with its current active member cases (aggregated from Progression).
        Removed cases are not returned. If caseCount differs from the number of member cases returned,
        the UI should show a mismatch warning. Permission: view_group_case (Court Admin, Legal Advisor).
        Audit required: Yes.
      parameters:
        - $ref: '#/components/parameters/CjscppuidHeader'
        - $ref: '#/components/parameters/CppclientcorrelationidHeader'
        - $ref: '#/components/parameters/GroupIdPath'
        - in: query
          name: referredCaseId
          required: false
          description: Id of the member case the page was accessed from, so the UI can place it first. Echoed back in the response.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group case found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCaseResponse'
        '403':
          description: Access control violation (view_group_case required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /groupcases/{groupId}/extractcases:
    post:
      operationId: extractGroupCases
      tags:
        - group-cases
      summary: Extract cases from a group case
      description: >-
        Removes one or more cases from the group, either to individual standalone cases (newGroup=false)
        or to a newly created group case (newGroup=true). For a new group the back end generates the
        groupId and chooses the lead case. If the original lead case is extracted, the back end selects
        a new lead for the original group and reduces its caseCount. Rejected (400) if one or fewer cases
        would remain in the original group. Permission: edit_group_case (Court Admin, Legal Advisor).
        Audit required: Yes.
      parameters:
        - $ref: '#/components/parameters/CjscppuidHeader'
        - $ref: '#/components/parameters/CppclientcorrelationidHeader'
        - $ref: '#/components/parameters/GroupIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractCasesRequest'
      responses:
        '200':
          description: Cases extracted. newGroupId is populated only when a new group was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractCasesResponse'
        '400':
          description: Invalid payload, or fewer than 2 cases would remain in the original group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access control violation (edit_group_case required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group case not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    subscriptionKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
      description: >-
        HMCTS APIM subscription key identifying the consuming system. Issued
        per consumer when their APIM product subscription is provisioned.

  parameters:
    CjscppuidHeader:
      in: header
      name: CJSCPPUID
      required: true
      schema:
        type: string
      description: User identifier for CP authentication

    CppclientcorrelationidHeader:
      in: header
      name: CPPCLIENTCORRELATIONID
      required: false
      schema:
        type: string
      description: Session-level correlation ID from UI

    GroupIdPath:
      in: path
      name: groupId
      required: true
      description: Unique id of the group case
      schema:
        type: string
        format: uuid

  schemas:
    ResultingIntent:
      type: string
      description: >-
        The intended result to be issued against the group case. Selected by the user when cases
        are split out of a group.
      enum:
        - ADJOURN
        - WITHDRAW

    LeadCase:
      type: object
      description: Summary of the lead case of a group. Contains personal data (defendant name, date of birth).
      required:
        - leadCaseId
        - caseUrn
        - defendantName
      properties:
        leadCaseId:
          type: string
          format: uuid
          description: Progression case id of the lead case
        caseUrn:
          type: string
          description: Case URN of the lead case
        defendantName:
          type: string
          description: Name of the lead defendant (personal data)
        defendantDoB:
          type: string
          format: date
          description: Date of birth of the lead defendant (personal data)

    CreateGroupCaseRequest:
      type: object
      required:
        - groupId
        - leadCase
        - dateOfHearing
        - caseCount
        - offenceType
        - courtHearingLocation
        - prosecutingAuthority
      properties:
        groupId:
          type: string
          format: uuid
          description: Id of the group, supplied by the caller (shared with Progression group_id)
        leadCase:
          $ref: '#/components/schemas/LeadCase'
        dateOfHearing:
          type: string
          format: date
          description: Date of the hearing
        caseCount:
          type: integer
          minimum: 1
          description: Number of cases in the group
        offenceType:
          type: string
          description: Type of offence, for example Council Tax or Business Rates
        courtHearingLocation:
          type: string
          description: Court location as OU code (7 characters, final 2 denote the courtroom)
        prosecutingAuthority:
          type: string
          description: Prosecuting authority as OU code
        parentGroupId:
          type: string
          format: uuid
          description: Group this group was extracted from. Omitted for an initial submission.
        resultingIntent:
          $ref: '#/components/schemas/ResultingIntent'

    GroupCaseSummary:
      type: object
      required:
        - groupId
        - prosecutingAuthority
        - leadCase
        - resultingIntent
      properties:
        groupId:
          type: string
          format: uuid
        prosecutingAuthority:
          type: string
          description: Prosecuting authority name, resolved from reference data by the service
        leadCase:
          $ref: '#/components/schemas/LeadCase'
        resultingIntent:
          $ref: '#/components/schemas/ResultingIntent'

    GroupCaseSearchResponse:
      type: object
      required:
        - groupCases
        - page
        - pageSize
        - totalElements
        - totalPages
      properties:
        groupCases:
          type: array
          items:
            $ref: '#/components/schemas/GroupCaseSummary'
        page:
          type: integer
          description: Zero-based page index
        pageSize:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    GroupMemberCase:
      type: object
      required:
        - caseId
        - caseUrn
        - defendantName
      properties:
        caseId:
          type: string
          format: uuid
        caseUrn:
          type: string
        defendantName:
          type: string
          description: Defendant name (personal data)
        defendantDoB:
          type: string
          format: date
          description: Defendant date of birth (personal data)
        address:
          $ref: '#/components/schemas/DefendantAddress'

    DefendantAddress:
      type: object
      description: Address of the defendant (personal data)
      required:
        - address1
      properties:
        address1:
          type: string
          description: Address Line 1 for the defendant
          minLength: 1
          maxLength: 35
        address2:
          type: string
          description: Address Line 2 for the defendant
          maxLength: 35
        address3:
          type: string
          description: Address Line 3 for the defendant
          maxLength: 35
        address4:
          type: string
          description: Address Line 4 for the defendant
          maxLength: 35
        address5:
          type: string
          description: Address Line 5 for the defendant
          maxLength: 35
        postcode:
          type: string
          description: UK Post Code (CGS DSC 5.25)
          pattern: '^[A-Z]{1,2}[0-9][A-Z0-9]?\s?[0-9][A-Z]{2}$'
          maxLength: 8

    GroupCaseResponse:
      type: object
      required:
        - groupId
        - prosecutingAuthority
        - courtHearingLocation
        - dateOfHearing
        - offenceType
        - leadCase
        - cases
        - createdDate
        - resultingIntent
      properties:
        groupId:
          type: string
          format: uuid
        prosecutingAuthority:
          type: string
        courtHearingLocation:
          type: string
          description: Court location as OU code
        dateOfHearing:
          type: string
          format: date
        offenceType:
          type: string
        leadCase:
          $ref: '#/components/schemas/GroupMemberCase'
        referredCaseId:
          type: string
          format: uuid
          description: Echo of the referredCaseId query parameter, if supplied
        cases:
          type: array
          description: Current active member cases of the group
          items:
            $ref: '#/components/schemas/GroupMemberCase'
        caseCount:
          type: integer
          description: Stored case count, for UI mismatch check against the size of cases
        createdDate:
          type: string
          format: date
          description: Date the group was created
        resultingIntent:
          $ref: '#/components/schemas/ResultingIntent'

    GroupCaseResultingIntent:
      type: object
      required:
        - groupId
        - resultingIntent
      properties:
        groupId:
          type: string
          format: uuid
        resultingIntent:
          $ref: '#/components/schemas/ResultingIntent'

    GroupCaseResultingIntentsResponse:
      type: object
      required:
        - groupCases
      properties:
        groupCases:
          type: array
          items:
            $ref: '#/components/schemas/GroupCaseResultingIntent'

    ExtractCasesRequest:
      type: object
      required:
        - caseIds
        - newGroup
        - resultingIntent
      properties:
        caseIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Ids of the cases to extract
        leadCaseId:
          type: string
          format: uuid
          description: Optional. Supplied if the original lead case is being extracted; must match one of caseIds.
        newGroup:
          type: boolean
          description: true if the extracted cases form a new group, false for individual cases
        resultingIntent:
          $ref: '#/components/schemas/ResultingIntent'

    ExtractCasesResponse:
      type: object
      properties:
        newGroupId:
          type: string
          format: uuid
          description: Id of the newly created group. Omitted when newGroup was false.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error context
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: Unique identifier for error tracing
